services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3001"
      ALLOWED_HOSTS: "quiz.duoswipe.lol,localhost,127.0.0.1"
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
